name: Deploy to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false # Queue merges so each one deploys in order.
permissions:
  contents: read
jobs:
  deploy:
    # Only Boldin's fork deploys; upstream and other forks have no token.
    if: github.repository == 'newretirement/geo-aeo-tracker'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://geo.prod.boldin.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Inlined at build time for the sitemap and page metadata.
      NEXT_PUBLIC_SITE_URL: https://geo.prod.boldin.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run cf:build
      - name: Deploy, tagged with the commit
        run: npx wrangler deploy --tag "${GITHUB_SHA::7}"
